server.port=${PORT:3001}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:sqlite:${DB_PATH:family-tree.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=always
server.error.include-message=never

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.llm.request=true
management.metrics.distribution.minimum-expected-value.llm.request=100ms
management.metrics.distribution.maximum-expected-value.llm.request=60s

server.address=127.0.0.1
spring.application.name=Family Tree Builder
