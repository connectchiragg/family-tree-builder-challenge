server.port=${PORT:3001}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:sqlite:${DB_PATH:family-tree.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=always
server.error.include-message=never

management.endpoints.web.exposure.include=health,metrics,prometheus,logfile
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.llm.request=true
management.metrics.distribution.minimum-expected-value.llm.request=100ms
management.metrics.distribution.maximum-expected-value.llm.request=60s

# Embedded local dashboard; retain the restricted Actuator endpoint list above.
server.address=127.0.0.1
spring.application.name=Family Tree Builder
spring.boot.admin.context-path=/admin
spring.boot.admin.client.url=http://127.0.0.1:${server.port}/admin
spring.boot.admin.client.instance.service-url=http://127.0.0.1:${server.port}
spring.boot.admin.client.instance.management-url=http://127.0.0.1:${server.port}/actuator
spring.boot.admin.client.instance.health-url=http://127.0.0.1:${server.port}/actuator/health

# Rolling local logs, visible through the dashboard's Logfile view.
logging.file.name=${LOG_FILE:logs/family-tree.log}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=50MB
logging.logback.rollingpolicy.clean-history-on-start=true

spring.boot.admin.ui.title=Family Tree | Observability
spring.boot.admin.ui.brand=<img src="assets/img/family-tree.svg" alt=""><span>Family Tree <small style="opacity:.65;font-weight:400;margin-left:8px">Observability</small></span>
spring.boot.admin.ui.theme.background-enabled=false
spring.boot.admin.ui.theme.color=#6366f1
spring.thymeleaf.check-template-location=false
